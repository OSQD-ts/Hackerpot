services:
  honeypot:
    build: .
    # `build:` and `image:` together mean compose REUSES an existing image with this
    # tag instead of building — and `npm run docker:build` tags exactly this name. After
    # changing any source, run `docker compose up -d --build`, or you will silently keep
    # running the old build.
    image: hackerpot
    restart: unless-stopped
    ports:
      - "4004:4004" # HTTP honeypot
      # Decoy TCP ports for the port-scan sentinel (must match SCAN_PORTS).
      # Adjust the host side if any of these are already in use on your machine.
      - "8022:8022"
      - "9200:9200"
      - "7001:7001"
    environment:
      PORT: "4004"
      HOST: "0.0.0.0"
      # OFF: this compose file publishes 4004 straight to the host, so there is no
      # trusted proxy overwriting X-Forwarded-For. Turning it on here would let any
      # client forge its own source IP. Set it to "true" only when you put a reverse
      # proxy you control in front (see nginx/ and README "nginx edge capture").
      TRUST_PROXY: "false"
      LOG_FORMAT: "json"
      SCAN_PORTS: "8022,9200,7001"
      SCAN_BANNER: "SSH-2.0-OpenSSH_8.4"
      # Share scores across replicas + keep a durable audit log.
      REDIS_URL: "redis://redis:6379"
      REDIS_SCORE_TTL: "3600"
      # Retention here is a MEMORY bound, not a preference. The Redis hit log is one
      # list holding whole incidents, captured request body included, so its worst case
      # is max_hits x the 64 KB body cap: the 10000 default is ~630 MB, against the
      # 256 MB this compose file gives the redis container. An attacker reaches that by
      # doing the one thing a honeypot invites — sending flagged requests with large
      # bodies — and the container is then OOM-killed and restarted empty, losing every
      # accrued score and every active block. That is an attacker-driven reset of the
      # state blocking depends on, which is a worse outcome than keeping fewer hits.
      #
      # A maxmemory-policy does not solve this: the hit log is a SINGLE key, so LRU
      # eviction would discard the small score and block keys first and leave the list
      # that is actually growing untouched. 1500 x 64 KB is ~95 MB, which fits with room
      # for the score and block keys beside it. Raise both together, never just this.
      REDIS_MAX_HITS: "1500"
      HIT_LOG: "/data/hits.jsonl"
      # Seed the exact fake credentials you planted in decoys (comma-separated).
      HONEYTOKENS: "AKIA_HACKERPOT_HONEYTOKEN_DEMO"
    volumes:
      - hitlog:/data
      # Your own settings, replacing the default config baked into the image.
      # Environment variables above still override whatever the file says.
      # - ./hackerpot.toml:/app/hackerpot.toml:ro

    # --- containment -------------------------------------------------------
    # This is the one container on the host whose job is to be attacked, so it gets
    # the outer boundary that matches the bounds the code keeps internally (every
    # per-IP map in the engine is capped for the same reason). If something here is
    # ever wrong, this is what decides whether it stays a container problem.
    #
    # The process binds only ports above 1024 and runs as uid 1000, so it needs no
    # capabilities at all, and writes nothing outside /data — verified by running the
    # image with exactly these settings.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    # Memory is the resource an attacker can most directly inflate. The engine caps
    # every map it owns, but a cap the kernel enforces is the one that holds if a
    # future detector forgets to. Raise it if you raise the store retention limits.
    mem_limit: 512m
    pids_limit: 256
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No published ports: reachable only on the compose network, by the honeypot.
    command: ["redis-server", "--save", "\"\"", "--appendonly", "no"]
    # Start AS the redis user rather than letting the entrypoint drop from root. The
    # image's entrypoint uses setpriv to step down, which needs SETUID/SETGID back —
    # starting unprivileged means the container is never root and still needs no
    # capabilities. Persistence is off above, so it writes nothing.
    user: redis
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  hitlog:
